name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 跟 OmniADB-Host 用同一套做法：runner image 本身已經帶 Android SDK，
      # 只要補上這個專案 compileSdk 對應的 platform 與 build-tools。
      # （`android-actions/setup-android` 在 2026-07 那次改版後會把 SDK 目錄搬走，
      #   Host 專案因此吃過一次紅燈，這裡直接沿用已經跑通的做法。）
      - name: Install SDK packages
        run: |
          SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniADB-Client-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
